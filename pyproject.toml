[project]
name = "rillza-vpn-tgbot"
version = "0.1.0"
description = "Telegram bot selling Rillza VPN subscriptions on top of a CELERITY panel"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.15",
    # Deliberately without [speedups]: that extra pulls in aiodns, which
    # makes c-ares aiohttp's process-wide default resolver. See
    # tests/test_dns_resolver.py.
    "aiohttp>=3.11",
    "alembic>=1.14",
    "apscheduler>=3.11",
    "asyncpg>=0.30",
    "loguru>=0.7.3",
    "orjson>=3.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
