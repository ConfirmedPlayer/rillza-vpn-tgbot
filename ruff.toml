exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "node_modules",
    "venv",
]

line-length = 79
indent-width = 4
target-version = "py313"

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific
]
# The product speaks Russian: RUF001-003 flag every Cyrillic letter that
# resembles a Latin one, which is noise here.
ignore = ["RUF001", "RUF002", "RUF003"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.isort]
# Required by format.skip-magic-trailing-comma.
split-on-trailing-comma = false

[lint.per-file-ignores]
# Package re-exports are intentional.
"__init__.py" = ["F401"]
# Autogenerated schema definitions: long column lines are not worth rewrapping.
"alembic/versions/*.py" = ["E501"]

[format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
docstring-code-format = false
