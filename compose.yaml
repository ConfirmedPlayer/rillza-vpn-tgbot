# Docker's default json-file driver never rotates. A bot that polls
# payments every 30 seconds writes steadily for months, and the first
# symptom of a full disk is Postgres refusing writes — which looks like
# the bot losing payments, not like a logging problem.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    logging: *logging
    # restart: unless-stopped only reacts to a process that exited. A
    # coroutine that hangs without crashing keeps the container "up"
    # while the bot answers nobody, and unattended on a VPS nobody
    # notices. This asks the scheduler's heartbeats from outside the
    # hung process — the one question a hang cannot answer falsely.
    #
    # Docker does not restart an unhealthy container by itself: this
    # surfaces the state in `docker ps` for something on the host to act
    # on. start_period covers the first boot, before any job has run.
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck"]
      interval: 60s
      timeout: 15s
      retries: 3
      # Must outlast the slowest first run (FIRST_RUN_LATEST in
      # app/core/jobs.py). The check reports a job that went quiet past
      # its own threshold, and after downtime longer than that every
      # heartbeat is stale at boot before the scheduler has done
      # anything wrong. Judging it then would have a host watchdog
      # restart the container just before the slow jobs' first runs,
      # for ever. tests/test_job_health.py pins the two together.
      start_period: 420s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rillza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rillza}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-rillza} -d ${POSTGRES_DB:-rillza}
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
